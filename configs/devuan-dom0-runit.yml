git:
  baseurl: https://github.com
  prefix: QubesOS/qubes-
  branch: main

backend-vmm: xen
debug: true
verbose: true
qubes-release: r4.3

mirrors:
  devuan:
    - https://pkgmaster.devuan.org/merged

deb:
  archive-keyring:
    devuan: /usr/share/keyrings/devuan-archive-keyring.gpg

distributions:
  - host-daedalus
  - vm-daedalus

components:
  - builder-debian:
      packages: false
  - vmm-xen
  - qubes-release
  - linux-kernel
  - linux-utils
  - core-qrexec
  - core-admin
  - gui-daemon
  - core-agent-linux
  - gui-agent-linux

executor:
  type: local

stages:
  - fetch
  - prep
  - build
